sentence=Flicker-free, tear-free DMA driver for SM16380 S-PWM HUB75 LED panels on the ESP32-S3.
paragraph=LCD_CAM + GDMA stream every panel line, the row scan included, so it loops in hardware with no CPU time. New frames are spliced in at the end of a scan pass: no blinking, seamless updates, ~68 fps animation on a 128x64 panel. Up to 3 chained panels. Optional Adafruit_GFX front end.
